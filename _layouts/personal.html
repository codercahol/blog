<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  {% if page.redirect_home %}<meta http-equiv="refresh" content="0;url={{ '/' | relative_url }}">{% endif %}
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | escape }}{% unless page.title == site.title %} — Leron Perez{% endunless %}</title>
  <meta name="description" content="{{ page.excerpt | strip_html | escape }}">
  <link rel="canonical" href="{% if page.redirect_home %}{{ "/" | absolute_url }}{% else %}{{ page.url | absolute_url }}{% endif %}">
  <link rel="stylesheet" href="{{ '/assets/css/personal.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <main id="main" class="personal-page" tabindex="-1">
    {{ content }}
  </main>
</body>
</html>
