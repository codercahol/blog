<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | escape }}{% unless page.title == site.title %} — Leron Perez{% endunless %}</title>
  <meta name="description" content="{{ page.excerpt | strip_html | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/personal.css' | relative_url }}">
  {% if page.homepage %}<link rel="stylesheet" href="{{ '/assets/css/homepage.css' | relative_url }}">{% endif %}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <main id="main" class="personal-page{% if page.homepage %} homepage{% endif %}" tabindex="-1">
    {{ content }}
  </main>
</body>
</html>
